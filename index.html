<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 戰術射擊遊戲</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #111;
            color: #fff;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-element {
            pointer-events: auto;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid #000;
            border-radius: 50%;
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }
        #bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .panel {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
        }
        #login-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        .login-box {
            background: #222;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #444;
            width: 300px;
        }
        .login-box input, .login-box select, .login-box button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            box-sizing: border-box;
        }
        .login-box button {
            background: #28a745;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .login-box button:hover {
            background: #218838;
        }
        #announcement {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 2px 2px 4px #000;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>進入戰場</h2>
            <input type="text" id="username" placeholder="輸入玩家代號" value="玩家">
            <select id="team-select">
                <option value="red">紅隊 (進攻方)</option>
                <option value="blue">藍隊 (防守方)</option>
            </select>
            <select id="weapon-select">
                <option value="rifle">突擊步槍</option>
                <option value="sniper">狙擊槍</option>
            </select>
            <button id="join-btn">加入遊戲</button>
        </div>
    </div>

    <div id="ui">
        <div id="top-bar" class="hud-element">
            <div id="team-score">紅隊 0 : 0 藍隊</div>
            <div id="match-timer">等待玩家加入 (1/2)...</div>
            <div id="objective-status">尋找目標</div>
        </div>
        
        <div id="crosshair"></div>
        <div id="announcement"></div>

        <div id="bottom-bar" class="hud-element">
            <div class="panel">
                <div>生命值: <span id="hp-val">100</span></div>
                <div>擊殺數: <span id="kill-val">0</span></div>
            </div>
            <div class="panel">
                <div>彈藥: <span id="ammo-val">30</span> / <span id="max-ammo">90</span></div>
            </div>
        </div>
    </div>

    <!-- 載入 Three.js 與 Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        let hp = 100;
        let kills = 0;
        let ammo = 30;
        let isReloading = false;
        let isAlive = true;
        let gameStarted = false;

        let otherPlayers = {};
        let activeBullets = [];
        let gunGroup;

        // C4 互動目標物
        let c4SiteMesh;
        const c4TargetPos = new THREE.Vector3(0, 0.1, -15);

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202025);
            scene.fog = new THREE.FogExp2(0x202025, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.9, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 環境光與太陽光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 地板
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 簡易障礙物與地圖建築
            createEnvironment();

            // 建立第一人稱槍械模型
            createGun();

            // 滑鼠視角控制
            document.addEventListener('mousemove', onMouseMove, false);
            document.addEventListener('mousedown', onMouseDown, false);
            document.addEventListener('keydown', onKeyDown, false);
            document.addEventListener('keyup', onKeyUp, false);
            window.addEventListener('resize', onWindowResize, false);

            document.getElementById('join-btn').addEventListener('click', () => {
                const name = document.getElementById('username').value || '玩家';
                const team = document.getElementById('team-select').value;
                const weapon = document.getElementById('weapon-select').value;

                socket.emit('joinGame', { name, team, weapon });
                document.getElementById('login-overlay').style.display = 'none';
                document.body.requestPointerLock();
            });

            setupSocketListeners();
        }

        function createEnvironment() {
            // 牆壁與掩體
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x555560 });
            
            for (let i = 0; i < 10; i++) {
                const boxGeo = new THREE.BoxGeometry(4, 3, 1);
                const box = new THREE.Mesh(boxGeo, wallMat);
                box.position.set((Math.random() - 0.5) * 40, 1.5, (Math.random() - 0.5) * 40);
                scene.add(box);
            }

            // C4 安裝點 (Bomb Site)
            const siteGeo = new THREE.BoxGeometry(3, 0.05, 3);
            const siteMat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.5 });
            c4SiteMesh = new THREE.Mesh(siteGeo, siteMat);
            c4SiteMesh.position.copy(c4TargetPos);
            scene.add(c4SiteMesh);
        }

        function createGun() {
            gunGroup = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.1, 0.15, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const gunBody = new THREE.Mesh(bodyGeo, bodyMat);
            gunBody.position.set(0.2, -0.2, -0.5);
            gunGroup.add(gunBody);

            camera.add(gunGroup);
            scene.add(camera);
        }

        let pitch = 0;
        let yaw = 0;
        function onMouseMove(event) {
            if (document.pointerLockElement !== document.body || !isAlive) return;

            const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
            const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;

            yaw -= movementX * 0.002;
            pitch -= movementY * 0.002;

            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

            camera.rotation.set(0, 0, 0);
            camera.rotateY(yaw);
            camera.rotateX(pitch);
        }

        function onMouseDown(event) {
            if (document.pointerLockElement !== document.body || !isAlive || !gameStarted) return;

            if (event.button === 0) {
                shootAction();
            } else if (event.button === 2) {
                // 右鍵互動 (安裝 C4 / 拆除 C4)
                const dist = camera.position.distanceTo(c4TargetPos);
                if (dist < 4) {
                    socket.emit('plantC4');
                }
            }
        }

        function shootAction() {
            if (isReloading || ammo <= 0) {
                if (ammo <= 0) reloadWeapon();
                return;
            }

            ammo--;
            document.getElementById('ammo-val').innerText = ammo;

            gunGroup.position.z += 0.05;
            setTimeout(() => { gunGroup.position.z -= 0.05; }, 80);

            const worldCameraPos = new THREE.Vector3();
            camera.getWorldPosition(worldCameraPos);

            const shootDir = new THREE.Vector3();
            camera.getWorldDirection(shootDir);
            shootDir.normalize(); // 修正方向向量，防止急殺或異常狀態下卡住

            const muzzlePos = worldCameraPos.clone().add(shootDir.clone().multiplyScalar(0.8));

            socket.emit('shoot', { 
                x: muzzlePos.x, 
                y: muzzlePos.y, 
                z: muzzlePos.z, 
                dirX: shootDir.x,
                dirY: shootDir.y,
                dirZ: shootDir.z
            });
        }

        function reloadWeapon() {
            if (isReloading) return;
            isReloading = true;
            document.getElementById('announcement').innerText = '裝填彈藥中...';
            setTimeout(() => {
                ammo = 30;
                document.getElementById('ammo-val').innerText = ammo;
                document.getElementById('announcement').innerText = '';
                isReloading = false;
            }, 2000);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'KeyR': reloadWeapon(); break;
                case 'KeyE': 
                    // E 鍵拆除或安裝 C4
                    if (camera.position.distanceTo(c4TargetPos) < 4) {
                        socket.emit('defuseC4');
                    }
                    break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupSocketListeners() {
            socket.on('currentPlayers', (players) => {
                for (let id in players) {
                    if (id !== socket.id) {
                        createOtherPlayer(players[id]);
                    }
                }
            });

            socket.on('newPlayer', (playerData) => {
                createOtherPlayer(playerData);
            });

            socket.on('playerMoved', (data) => {
                if (otherPlayers[data.id]) {
                    otherPlayers[data.id].mesh.position.set(data.x, data.y, data.z);
                    otherPlayers[data.id].mesh.rotation.y = data.rotY;
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id].mesh);
                    delete otherPlayers[id];
                }
            });

            socket.on('startCountdown', (sec) => {
                document.getElementById('announcement').innerText = `遊戲即將開始: ${sec}`;
            });

            socket.on('updateCountdown', (sec) => {
                document.getElementById('announcement').innerText = `遊戲即將開始: ${sec}`;
            });

            socket.on('gameStarted', () => {
                gameStarted = true;
                document.getElementById('announcement').innerText = '';
            });

            socket.on('updateMatchTimer', (time) => {
                let m = Math.floor(time / 60);
                let s = time % 60;
                document.getElementById('match-timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            });

            socket.on('updateBullets', (bullets) => {
                updateBulletsRender(bullets);
            });

            socket.on('damaged', (newHp) => {
                hp = newHp;
                document.getElementById('hp-val').innerText = hp;
                if (hp <= 0) {
                    isAlive = false;
                    document.getElementById('announcement').innerText = '你已被擊殺！等待回合重置...';
                    document.exitPointerLock();
                }
            });

            socket.on('updateKills', (k) => {
                kills = k;
                document.getElementById('kill-val').innerText = kills;
            });

            socket.on('c4Planting', (msg) => {
                document.getElementById('announcement').innerText = msg;
            });

            socket.on('c4Planted', () => {
                document.getElementById('announcement').innerText = 'C4 已安裝！防守方請前往拆除！';
                c4SiteMesh.material.color.setHex(0xff6600);
            });

            socket.on('c4Countdown', (time) => {
                document.getElementById('announcement').innerText = `C4 倒數引爆: ${time} 秒`;
            });

            socket.on('c4Defused', () => {
                document.getElementById('announcement').innerText = 'C4 已被成功拆除！';
                c4SiteMesh.material.color.setHex(0xff0000);
                setTimeout(() => { document.getElementById('announcement').innerText = ''; }, 3000);
            });

            socket.on('gameOver', (data) => {
                gameStarted = false;
                document.getElementById('announcement').innerText = `遊戲結束! 贏家: ${data.winner === 'red' ? '紅隊' : '藍隊'} (${data.reason})`;
            });

            socket.on('restartRound', (players) => {
                isAlive = true;
                hp = 100;
                document.getElementById('hp-val').innerText = hp;
                document.getElementById('announcement').innerText = '';
                if (players[socket.id]) {
                    camera.position.set(players[socket.id].x, players[socket.id].y, players[socket.id].z);
                }
                gameStarted = true;
            });

            socket.on('resetToWaiting', () => {
                gameStarted = false;
                document.getElementById('match-timer').innerText = '等待玩家加入 (1/2)...';
                document.getElementById('announcement').innerText = '人數不足，等待其他玩家連線中...';
            });
        }

        function createOtherPlayer(data) {
            const geo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
            const mat = new THREE.MeshStandardMaterial({ color: data.team === 'red' ? 0xff3333 : 0x3333ff });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(data.x, data.y, data.z);
            scene.add(mesh);
            otherPlayers[data.id] = { mesh: mesh };
        }

        let bulletMeshes = [];
        function updateBulletsRender(bullets) {
            // 移除舊的子彈視覺物件
            bulletMeshes.forEach(m => scene.remove(m));
            bulletMeshes = [];

            // 建立新的子彈視覺
            bullets.forEach(b => {
                const bGeo = new THREE.SphereGeometry(0.1, 8, 8);
                const bMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const bMesh = new THREE.Mesh(bGeo, bMat);
                bMesh.position.set(b.x, b.y, b.z);
                scene.add(bMesh);
                bulletMeshes.push(bMesh);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (document.pointerLockElement === document.body && isAlive && gameStarted) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(-velocity.z * delta);

                // 限制高度
                camera.position.y = 0.9;

                // 傳送玩家位置給伺服器
                socket.emit('playerMovement', {
                    x: camera.position.x,
                    y: camera.position.y,
                    z: camera.position.z,
                    rotY: yaw
                });
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
