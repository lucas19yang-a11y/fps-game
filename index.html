<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>決密槍戰 - 多人線上 C4 爆破模式</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; text-align: center; font-size: 16px; background: rgba(0, 0, 0, 0.9);
            padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(255,51,102,0.4);
            border: 2px solid #ff3366; z-index: 20; max-width: 420px; width: 90%; box-sizing: border-box;
        }
        #instructions h2 { margin-top: 0; color: #ff3366; letter-spacing: 2px; font-size: 22px; }
        .setting-group { margin: 10px 0; text-align: left; background: rgba(255, 255, 255, 0.05); padding: 8px; border-radius: 8px; }
        .setting-group label { display: block; margin-bottom: 5px; color: #00ffcc; font-weight: bold; font-size: 14px; }
        .setting-group select, .setting-group input { width: 100%; padding: 8px; background: #111; color: white; border: 1px solid #00ffcc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        #start-btn { background: #ff3366; color: #fff; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; pointer-events: none; display: none; z-index: 5;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background-color: #fff; box-shadow: 0 0 2px #000; }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #hud {
            position: absolute; top: 15px; left: 15px; color: #00ffcc; font-size: 15px; font-weight: bold;
            background: rgba(0, 0, 0, 0.6); padding: 10px 14px; border-radius: 8px; border: 2px solid #00ffcc;
            display: none; z-index: 5; line-height: 1.5; pointer-events: none;
        }
        #match-timer {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); color: #ffffff; font-size: 20px; font-weight: bold;
            background: rgba(0, 0, 0, 0.8); padding: 8px 20px; border-radius: 8px; border: 2px solid #ffffff;
            display: none; z-index: 5; text-align: center; pointer-events: none;
        }
        #c4-status {
            position: absolute; top: 65px; left: 50%; transform: translateX(-50%); color: #ffaa00; font-size: 15px; font-weight: bold;
            background: rgba(0, 0, 0, 0.8); padding: 6px 14px; border-radius: 8px; border: 2px solid #ffaa00;
            display: none; z-index: 5; text-align: center; pointer-events: none;
        }
        #team-hud {
            position: absolute; top: 15px; right: 15px; color: #ff3366; font-size: 15px; font-weight: bold;
            background: rgba(0, 0, 0, 0.7); padding: 8px 12px; border-radius: 8px; border: 2px solid #ff3366;
            display: none; z-index: 5; pointer-events: none;
        }

        #status-overlay {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
            color: #ffaa00; font-size: 24px; font-weight: bold; text-shadow: 0 2px 6px #000;
            display: none; z-index: 15; text-align: center; pointer-events: none;
            background: rgba(0,0,0,0.7); padding: 15px 30px; border-radius: 10px; border: 2px solid #ffaa00;
        }

        /* 平板/手機專用虛擬控制按鈕區 */
        #mobile-controls {
            position: absolute; bottom: 20px; width: 100%; display: none; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; z-index: 10; pointer-events: none;
        }
        .control-pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px); gap: 5px; pointer-events: auto; }
        .m-btn { background: rgba(0, 255, 204, 0.3); border: 2px solid #00ffcc; color: white; font-size: 18px; font-weight: bold; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .action-pad { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
        .action-btn { width: 70px; height: 70px; background: rgba(255, 51, 102, 0.4); border: 2px solid #ff3366; color: white; font-size: 14px; font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="status-overlay">等待第二位玩家加入...</div>
    
    <div id="hud">
        生命值: <span id="hp">100</span><br>
        擊殺數: <span id="kills">0</span>
    </div>

    <div id="match-timer">02:00</div>
    <div id="c4-status">C4 狀態: 未安裝</div>
    <div id="team-hud">陣營載入中...</div>

    <!-- 平板專用虛擬控制介面 -->
    <div id="mobile-controls">
        <div class="control-pad">
            <div></div><button class="m-btn" id="btn-w">▲</button><div></div>
            <button class="m-btn" id="btn-a">◀</button><button class="m-btn" id="btn-s">▼</button><button class="m-btn" id="btn-d">▶</button>
        </div>
        <div class="action-pad">
            <button class="action-btn" id="btn-action">C4互動</button>
            <button class="action-btn" id="btn-fire" style="background:rgba(255,0,0,0.5); border-color:red;">開火</button>
        </div>
    </div>

    <div id="instructions">
        <h2>決密槍戰 - 線上對戰</h2>
        <div class="setting-group">
            <label for="player-name">玩家名稱：</label>
            <input type="text" id="player-name" value="玩家" maxlength="10">
        </div>
        <div class="setting-group">
            <label for="team-select">選擇你的陣營：</label>
            <select id="team-select">
                <option value="red">紅隊 (進攻方 - 可安裝 C4)</option>
                <option value="blue">藍隊 (防守方 - 可拆除 C4)</option>
            </select>
        </div>
        <div class="setting-group">
            <label for="weapon-select">選擇你的武器：</label>
            <select id="weapon-select">
                <option value="ak47">AK-47 (全自動步槍)</option>
                <option value="g18">G18 (全自動手槍)</option>
            </select>
        </div>
        <p style="font-size:12px; color:#ccc;">電腦：WASD移動 | 滑鼠轉視角 | 左鍵開火<br>平板：畫面右側拖曳轉視角 | 左下虛擬方向鍵</p>
        <button id="start-btn">進入戰場</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const socket = io();
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x3388cc);
        scene.fog = new THREE.FogExp2(0x3388cc, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const directionalLight = new THREE.DirectionalLight(0xffffee, 1.8);
        directionalLight.position.set(30, 50, 30);
        scene.add(directionalLight);

        // PBR 網格地板
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#222225'; ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = '#333338'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, 512, 512);
        ctx.fillStyle = '#2a2a2e';
        ctx.fillRect(10, 10, 236, 236); ctx.fillRect(266, 10, 236, 236);
        ctx.fillRect(10, 266, 236, 236); ctx.fillRect(266, 266, 236, 236);

        const floorTexture = new THREE.CanvasTexture(canvas);
        floorTexture.wrapS = THREE.RepeatWrapping; floorTexture.wrapT = THREE.RepeatWrapping;
        floorTexture.repeat.set(20, 20);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(150, 150), new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.4, metalness: 0.2 }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const obstacles = [];
        for (let i = 0; i < 25; i++) {
            const obs = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), new THREE.MeshStandardMaterial({ color: 0x5a6d5e }));
            const x = (Math.random() - 0.5) * 70, z = (Math.random() - 0.5) * 70;
            if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;
            obs.position.set(x, 1.5, z);
            scene.add(obs);
            obstacles.push(obs);
        }

        const bombSitePos = new THREE.Vector3(0, 0, -25);
        const bombSite = new THREE.Mesh(
            new THREE.CylinderGeometry(2, 2, 0.1, 32),
            new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0xff3366, emissiveIntensity: 0.5 })
        );
        bombSite.position.copy(bombSitePos); bombSite.position.y = 0.05;
        scene.add(bombSite);

        const player = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1.8, 1),
            new THREE.MeshStandardMaterial({ color: 0x00aaff })
        );
        player.position.set(0, 0.9, 0);
        scene.add(player);
        camera.position.set(0, 0.7, 0);
        player.add(camera);

        const gunGroup = new THREE.Group();
        gunGroup.position.set(0.28, -0.22, -0.55);
        camera.add(gunGroup);

        const loader = new GLTFLoader();
        function loadWeapon(type) {
            while(gunGroup.children.length > 0) gunGroup.remove(gunGroup.children[0]);
            let url = (type === 'ak47') ? 
                'https://raw.githubusercontent.com/lucas19yang-a11y/no/main/ak-47__high_poly__pbr__fbx.glb' : 
                'https://raw.githubusercontent.com/lucas19yang-a11y/-/main/g18.glb';

            loader.load(url, (gltf) => {
                const model = gltf.scene;
                model.scale.set(0.8, 0.8, 0.8);
                model.rotation.y = (type === 'ak47') ? Math.PI / 2 : Math.PI;
                gunGroup.add(model);
            }, undefined, () => {
                gunGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.2, 1.0), new THREE.MeshStandardMaterial({ color: 0x222225 })));
            });
        }

        const remotePlayers = {};
        let playerTeam = 'red';
        let gameStarted = false;
        let isCanControl = false;
        let verticalVelocity = 0, isJumping = false;
        const gravity = 25.0, jumpForce = 9.0, groundY = 0.9;
        let c4Planted = false, c4Mesh = null;

        // Socket 事件監聽
        socket.on('currentPlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach((id) => {
                if (id === socket.id) {
                    if (serverPlayers[id].status === 'spectating') {
                        document.getElementById('status-overlay').style.display = 'block';
                        document.getElementById('status-overlay').innerText = "遊戲進行中，您將在下一局加入";
                    }
                } else {
                    addRemotePlayer(serverPlayers[id]);
                }
            });
        });

        socket.on('newPlayer', (info) => { addRemotePlayer(info); });

        socket.on('startCountdown', (sec) => {
            const overlay = document.getElementById('status-overlay');
            overlay.style.display = 'block';
            overlay.innerText = `第二位玩家已加入！遊戲將在 ${sec} 秒後開始...`;
        });

        socket.on('updateCountdown', (sec) => {
            const overlay = document.getElementById('status-overlay');
            if (sec > 0) {
                overlay.innerText = `遊戲即將開始：${sec}`;
            } else {
                overlay.innerText = `戰鬥開始！`;
                setTimeout(() => { overlay.style.display = 'none'; }, 1000);
            }
        });

        socket.on('gameStarted', () => {
            isCanControl = true;
            document.getElementById('status-overlay').style.display = 'none';
        });

        socket.on('resetToWaiting', () => {
            const overlay = document.getElementById('status-overlay');
            overlay.style.display = 'block';
            overlay.innerText = "等待第二位玩家加入...";
            isCanControl = false;
        });

        socket.on('playerMoved', (info) => {
            if (remotePlayers[info.id]) {
                remotePlayers[info.id].position.set(info.x, info.y, info.z);
                remotePlayers[info.id].rotation.y = info.rotY;
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (remotePlayers[id]) {
                scene.remove(remotePlayers[id]);
                delete remotePlayers[id];
            }
        });

        socket.on('c4Planted', (state) => {
            c4Planted = true;
            c4Mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            c4Mesh.position.copy(bombSitePos); c4Mesh.position.y = 0.1;
            scene.add(c4Mesh);
            document.getElementById('c4-status').innerText = "C4 已安裝！";
        });

        socket.on('c4Defused', () => {
            c4Planted = false;
            if (c4Mesh) { scene.remove(c4Mesh); c4Mesh = null; }
            document.getElementById('c4-status').innerText = "C4 已被拆除！";
        });

        socket.on('playerShot', (data) => {
            if (remotePlayers[data.id]) {
                // 收到其他玩家開槍動作
            }
        });

        function addRemotePlayer(info) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1.8, 1),
                new THREE.MeshStandardMaterial({ color: info.team === 'red' ? 0xff3366 : 0x00aaff })
            );
            mesh.position.set(info.x, info.y, info.z);
            scene.add(mesh);
            remotePlayers[info.id] = mesh;
        }

        // 開始遊戲按鈕事件
        const startBtn = document.getElementById('start-btn');
        const handleStart = (e) => {
            e.preventDefault();
            playerTeam = document.getElementById('team-select').value;
            const playerName = document.getElementById('player-name').value;
            const weaponType = document.getElementById('weapon-select').value;

            loadWeapon(weaponType);
            socket.emit('joinGame', { name: playerName, team: playerTeam, weapon: weaponType });

            gameStarted = true;
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('match-timer').style.display = 'block';
            document.getElementById('c4-status').style.display = 'block';
            document.getElementById('team-hud').style.display = 'block';

            if (isMobile) {
                document.getElementById('mobile-controls').style.display = 'flex';
            }

            const teamHud = document.getElementById('team-hud');
            teamHud.innerText = playerTeam === 'red' ? "陣營: 紅隊 (進攻方)" : "陣營: 藍隊 (防守方)";
            teamHud.style.borderColor = playerTeam === 'red' ? "#ff3366" : "#00ffcc";

            if (!isMobile) {
                renderer.domElement.requestPointerLock();
            }
        };
        startBtn.addEventListener('click', handleStart);
        startBtn.addEventListener('touchstart', handleStart);

        renderer.domElement.addEventListener('click', () => {
            if (gameStarted && !isMobile) renderer.domElement.requestPointerLock();
        });

        // 視角控制
        window.onmousemove = (e) => {
            if (!isMobile && document.pointerLockElement === renderer.domElement && gameStarted) {
                player.rotation.y -= e.movementX * 0.002;
                camera.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, camera.rotation.x - e.movementY * 0.002));
            }
        };

        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            if (isMobile && gameStarted && e.touches.length === 1) {
                if (e.touches[0].clientX > window.innerWidth / 2) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isMobile && gameStarted && e.touches.length === 1) {
                if (e.touches[0].clientX > window.innerWidth / 2) {
                    const deltaX = e.touches[0].clientX - touchStartX;
                    const deltaY = e.touches[0].clientY - touchStartY;
                    player.rotation.y -= deltaX * 0.005;
                    camera.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, camera.rotation.x - deltaY * 0.005));
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            }
        }, { passive: true });

        // 移動控制
        const moveState = { forward: false, backward: false, left: false, right: false };
        const speed = 10.0;

        document.addEventListener('keydown', (e) => {
            if (!gameStarted || !isCanControl) return;
            if (e.code === 'KeyW') moveState.forward = true;
            if (e.code === 'KeyS') moveState.backward = true;
            if (e.code === 'KeyA') moveState.left = true;
            if (e.code === 'KeyD') moveState.right = true;
            if (e.code === 'Space' && !isJumping) { verticalVelocity = jumpForce; isJumping = true; }
            if (e.code === 'KeyE') startAction();
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveState.forward = false;
            if (e.code === 'KeyS') moveState.backward = false;
            if (e.code === 'KeyA') moveState.left = false;
            if (e.code === 'KeyD') moveState.right = false;
        });

        function bindTouchButton(id, stateKey) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[stateKey] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); moveState[stateKey] = false; });
        }
        bindTouchButton('btn-w', 'forward');
        bindTouchButton('btn-s', 'backward');
        bindTouchButton('btn-a', 'left');
        bindTouchButton('btn-d', 'right');

        // 開火與動作按鈕
        const fireBtn = document.getElementById('btn-fire');
        const triggerShoot = (e) => {
            e.preventDefault();
            if (gameStarted && isCanControl) {
                gunGroup.position.z += 0.05;
                setTimeout(() => { gunGroup.position.z -= 0.05; }, 100);
                socket.emit('shoot', { x: player.position.x, y: player.position.y, z: player.position.z, rotY: player.rotation.y });
            }
        };
        fireBtn.addEventListener('touchstart', triggerShoot);
        fireBtn.addEventListener('click', triggerShoot);

        const actionBtn = document.getElementById('btn-action');
        const triggerAction = (e) => {
            e.preventDefault();
            startAction();
        };
        actionBtn.addEventListener('touchstart', triggerAction);
        actionBtn.addEventListener('click', triggerAction);

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0 && gameStarted && isCanControl && (isMobile || document.pointerLockElement === renderer.domElement)) {
                gunGroup.position.z += 0.05;
                setTimeout(() => { gunGroup.position.z -= 0.05; }, 100);
                socket.emit('shoot', { x: player.position.x, y: player.position.y, z: player.position.z, rotY: player.rotation.y });
            }
        });

        function startAction() {
            const dist = player.position.distanceTo(bombSitePos);
            if (playerTeam === 'red' && !c4Planted && dist <= 3.5) {
                socket.emit('plantC4');
            } else if (playerTeam === 'blue' && c4Planted && dist <= 3.5) {
                socket.emit('defuseC4');
            }
        }

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (gameStarted && isCanControl) {
                if (isJumping) {
                    verticalVelocity -= gravity * delta;
                    player.position.y += verticalVelocity * delta;
                    if (player.position.y <= groundY) {
                        player.position.y = groundY;
                        isJumping = false;
                        verticalVelocity = 0;
                    }
                }

                const moveDir = new THREE.Vector3();
                if (moveState.forward) moveDir.z -= 1;
                if (moveState.backward) moveDir.z += 1;
                if (moveState.left) moveDir.x -= 1;
                if (moveState.right) moveDir.x += 1;
                moveDir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);

                player.position.x += moveDir.x * speed * delta;
                player.position.z += moveDir.z * speed * delta;

                socket.emit('playerMovement', {
                    x: player.position.x,
                    y: player.position.y,
                    z: player.position.z,
                    rotY: player.rotation.y
                });
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
